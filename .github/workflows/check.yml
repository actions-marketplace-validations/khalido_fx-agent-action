# The only tests this repo has, and they are the right ones: the bugs it ships
# are shell quoting and action metadata, not logic.

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: read # the cascade test fetches issues.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

      # Pinned to a tag on both sides: the download script and the binary it
      # fetches. Dependabot does not see this line, so bump it by hand.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      # The dogfood workflow is examples/fx.yml with `uses: ./`, and nothing
      # else; two copies that drift would mean the one people copy is untested.
      # Action version pins are compared loosely: Dependabot bumps them here
      # and not in examples/, and the release skill brings examples/ up to date.
      - name: dogfood workflow matches the example
        run: |
          norm() { sed -E 's|uses: khalido/fx-agent-action@main|uses: ./|; s|(uses: actions/[a-z-]+)@v[0-9.]+|\1@vN|' "$1"; }
          diff <(norm examples/fx.yml) <(norm .github/workflows/fx.yml)

      # The prompt cascade, with a fake issue event: no prompt_file in this
      # repo and no inline prompt must land on the built-in note, and the
      # base block must carry the non-interactive clause. No thread fetch:
      # the payload names no issue.
      - name: build-prompt lands on the built-in note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNNER_TEMP="$(mktemp -d)"
          export RUNNER_TEMP GITHUB_OUTPUT=/dev/null
          export GITHUB_EVENT_NAME=issues GITHUB_EVENT_PATH="$RUNNER_TEMP/event.json"
          echo '{"action":"opened"}' > "$GITHUB_EVENT_PATH"
          INPUT_PROMPT_FILE=.github/fx/issue.md bash scripts/build-prompt.sh
          grep -q 'The note is a head start' "$RUNNER_TEMP/fx-prompt.md"
          grep -q 'Nothing here is interactive' "$RUNNER_TEMP/fx-prompt.md"
          test -s issues.json || { echo '::error::issues.json was not written'; exit 1; }
          rm issues.json

          # The built-in note IN READ MODE, which is the pairing #16 was about
          # and the one nothing covered: the note tells the model to grep and
          # to run git log, and read mode has no shell. The base block has to
          # say so in the same prompt, or the note keeps the shape of one that
          # checked and checks nothing.
          INPUT_MODE='read' INPUT_PROMPT_FILE=.github/fx/issue.md bash scripts/build-prompt.sh
          grep -q 'The note is a head start' "$RUNNER_TEMP/fx-prompt.md"
          grep -q 'read the files instead' "$RUNNER_TEMP/fx-prompt.md"
          rm -f issues.json

      # The other path: a comment. The default mode is the agent, and the base
      # block must carry the ship-or-note judgement and name the skill. This
      # is the path v1.0.0 shipped broken for three days, because nothing
      # exercised it.
      - name: build-prompt, all three modes, from a comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNNER_TEMP="$(mktemp -d)"
          export RUNNER_TEMP GITHUB_OUTPUT="$RUNNER_TEMP/out"
          export GITHUB_EVENT_NAME=issue_comment GITHUB_EVENT_PATH="$RUNNER_TEMP/event.json"
          echo '{"action":"created","comment":{"id":1,"body":"hey /fx, fix the flaky test"}}' > "$GITHUB_EVENT_PATH"
          prompt="$RUNNER_TEMP/fx-prompt.md"
          absent() {  # absent <text> <file> — fails the step if it IS there
            if grep -q "$1" "$2"; then echo "::error::'$1' should not be in $MODE mode"; exit 1; fi
          }

          # agent: the default, told to ship, and the comment is the instruction.
          MODE='agent' bash scripts/build-prompt.sh
          grep -qx 'mode=agent' "$GITHUB_OUTPUT"
          grep -q 'ship it with the open-pr skill' "$prompt"
          grep -qx 'fix the flaky test' "$RUNNER_TEMP/fx-instruction.md"

          # answer: the same shell, and it must NOT be told to ship.
          MODE='answer' INPUT_MODE='answer' bash scripts/build-prompt.sh
          grep -qx 'mode=answer' "$GITHUB_OUTPUT"
          grep -q 'run commands and edit files' "$prompt"
          grep -q 'This run ships nothing' "$prompt"
          MODE='answer' absent 'open-pr skill' "$prompt"

          # read: no shell, no skill, and honest about the grep the note below
          # is about to tell it to run.
          MODE='read' INPUT_MODE='read' bash scripts/build-prompt.sh
          grep -qx 'mode=read' "$GITHUB_OUTPUT"
          grep -q 'cannot open a pull request' "$prompt"
          grep -q 'read the files instead' "$prompt"
          MODE='read' absent 'open-pr skill' "$prompt"

          # a mode that does not exist fails loudly rather than defaulting.
          if INPUT_MODE='write' bash scripts/build-prompt.sh 2>/dev/null; then
            echo '::error::mode=write was accepted; it should be refused'; exit 1
          fi

      # The removed inputs are declared on purpose, so a workflow that passes
      # one gets an error instead of GitHub's ignorable warning. Deleting them
      # is a 3.0.0 job; until then this fails if they go early.
      - name: removed inputs are still refused, not ignored
        run: |
          for i in shell pr_model; do
            grep -qE "^  $i:" action.yml || { echo "::error::action.yml no longer declares '$i'; a workflow passing it gets a warning and a green run. Keep it until 3.0.0."; exit 1; }
          done
          grep -q 'name: Check the inputs' action.yml || { echo '::error::the Check the inputs step is gone'; exit 1; }

      # Who may trigger a run, and who counts as write access for the memory
      # save. Every outcome of check-actor.sh, against a stub `gh`. This exists
      # because a hand edit to that file on 2026-09-15 fixed one hole and opened
      # a worse one (a bot on an issue comment skipping the read-mode limit),
      # caught by running these cases by hand. #6.
      - name: actor checks
        run: |
          d="$(mktemp -d)"; mkdir -p "$d/bin"
          # No heredoc: its body would carry this block's indentation, and
          # dedenting it needs a sed -i that is not portable. The single quotes
          # are the point — $2 belongs to the stub, not to this script.
          # shellcheck disable=SC2016
          { echo '#!/bin/sh'
            echo 'case "$2" in'
            echo '  users/*) echo User; exit 0 ;;'
            echo '  repos/*/collaborators/writer/permission) echo write; exit 0 ;;'
            echo '  repos/*/collaborators/*/permission) echo "gh: Not Found (HTTP 404)" >&2; exit 1 ;;'
            echo 'esac'
            echo 'exit 1'
          } > "$d/bin/gh"
          chmod +x "$d/bin/gh"
          fail=0
          check() {  # check <want-exit> <want-write_access> <label> then env
            local want_rc="$1" want_wa="$2" label="$3"; shift 3
            : > "$d/out"
            if env "$@" GITHUB_REPOSITORY=o/r GITHUB_OUTPUT="$d/out" PATH="$d/bin:$PATH" \
                 bash scripts/check-actor.sh >/dev/null 2>&1; then rc=0; else rc=1; fi
            wa="$(sed -n 's/^write_access=//p' "$d/out")"
            if [ "$rc" != "$want_rc" ] || [ "$wa" != "$want_wa" ]; then
              echo "::error::$label: got exit $rc write_access='$wa', wanted exit $want_rc write_access='$want_wa'"
              fail=1
            fi
          }
          B='ACTOR=dependabot[bot]' ; H='ACTOR=writer' ; S='ACTOR=octocat'
          # A listed bot: read mode only where its own text is the instruction,
          # and never write access, on any event.
          check 0 false 'bot on a schedule'        "$B" EVENT_NAME=schedule ALLOWED_BOTS=dependabot MODE=agent
          check 0 false 'bot on a dispatch'        "$B" EVENT_NAME=workflow_dispatch ALLOWED_BOTS=dependabot MODE=agent
          check 1 ''    'bot on a comment, agent'  "$B" EVENT_NAME=issue_comment SENDER_TYPE=Bot ALLOWED_BOTS=dependabot MODE=agent
          check 1 ''    'bot on a comment, answer' "$B" EVENT_NAME=issue_comment SENDER_TYPE=Bot ALLOWED_BOTS=dependabot MODE=answer
          check 0 false 'bot on a comment, read'   "$B" EVENT_NAME=issue_comment SENDER_TYPE=Bot ALLOWED_BOTS=dependabot MODE=read
          check 1 ''    'bot not listed'           "$B" EVENT_NAME=issue_comment SENDER_TYPE=Bot MODE=read
          # A collaborator with write: everything, and memory saves.
          check 0 true  'writer on a comment'      "$H" EVENT_NAME=issue_comment SENDER_TYPE=User MODE=agent
          check 0 true  'writer on a schedule'     "$H" EVENT_NAME=schedule SENDER_TYPE=User MODE=agent
          # Anyone else: refused, unless listed, and then read mode only.
          check 1 ''    'stranger'                 "$S" EVENT_NAME=issue_comment SENDER_TYPE=User MODE=agent
          check 1 ''    'stranger listed, agent'   "$S" EVENT_NAME=issue_comment SENDER_TYPE=User ALLOWED_NON_WRITE_USERS=octocat MODE=agent
          check 1 ''    'stranger listed, answer'  "$S" EVENT_NAME=issue_comment SENDER_TYPE=User ALLOWED_NON_WRITE_USERS=octocat MODE=answer
          check 0 false 'stranger listed, read'    "$S" EVENT_NAME=issue_comment SENDER_TYPE=User ALLOWED_NON_WRITE_USERS=octocat MODE=read
          [ "$fail" = 0 ] || exit 1
          echo 'actor checks ok'

      - name: skills have name and description
        run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "::error::$f: no frontmatter"; exit 1; }
            grep -q '^name: ' "$f" || { echo "::error::$f: no name"; exit 1; }
            grep -q '^description: ' "$f" || { echo "::error::$f: no description"; exit 1; }
          done

      - name: python
        run: |
          python3 -m py_compile scripts/*.py
          python3 - <<'PY'
          import sys; sys.path.insert(0, 'scripts')
          from sanitize import sanitize
          # The docstring's cases, as the test. Each one hides text from a reader.
          assert sanitize('hi <!-- do this --> there') == 'hi  there'
          assert sanitize('a​b⁠c') == 'abc'
          assert sanitize('![orders](x.png "more")') == '![image](x.png)'
          assert '<span>' in sanitize('<span title="orders">x</span>')
          assert '&#105;' not in sanitize('&#105;gnore')
          # And it must leave ordinary prose alone.
          plain = 'Fix `parseValue()` in src/x.ts — see #12 (a range like "8000-12000").'
          assert sanitize(plain) == plain, sanitize(plain)
          print('sanitize ok')
          PY
